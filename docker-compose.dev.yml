services:
  app:
    container_name: game_server_app
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3031:3031"
      - "3032:3032"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./.sqlite-data:/.sqlite-data
    environment:
      NODE_ENV: development
      PORT: 3031
      TZ: UTC
      SQLITE_DB_PATH: /.sqlite-data/app.db
    command: npm run dev:full
    restart: unless-stopped